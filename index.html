<!DOCTYPE html>
<html>
<head>
    <title>Parking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container text-center mt-5">

    <!-- 🔔 Flash Messages (Improved) -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, msg in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

    <h1 class="mb-4">🚗 Parking Lot Management</h1>

    <a href="/entry" class="btn btn-success m-2">Vehicle Entry</a>
    <a href="/exit" class="btn btn-danger m-2">Vehicle Exit</a>
    <a href="/logout" class="btn btn-secondary m-2">Logout</a>

</div>

</body>
</html>
