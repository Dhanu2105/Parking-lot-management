<!DOCTYPE html>
<html>
<head>
    <title>Entry</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 col-md-4 mx-auto">
        <h3>Vehicle Entry</h3>

        <form method="POST">
            <input type="text" name="vehicle_number" class="form-control mb-3" placeholder="Vehicle Number" required>

            <select name="vehicle_type" class="form-control mb-3">
                <option>Car</option>
                <option>Bike</option>
            </select>

            <button class="btn btn-success w-100">Park Vehicle</button>
        </form>
    </div>
</div>

</body>
</html>
